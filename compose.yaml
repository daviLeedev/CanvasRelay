services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${CANVASRELAY_POSTGRES_DB:-canvasrelay}
      POSTGRES_USER: ${CANVASRELAY_POSTGRES_USER:-canvasrelay}
      POSTGRES_PASSWORD: ${CANVASRELAY_POSTGRES_PASSWORD:-canvasrelay-dev-only}
    volumes:
      - canvasrelay-postgres:/var/lib/postgresql/data
    ports:
      - "${CANVASRELAY_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      CANVASRELAY_ENV: development
      CANVASRELAY_DEMO_MODE: "true"
      CANVASRELAY_CORS_ORIGINS: http://localhost:${CANVASRELAY_WEB_PORT:-13080},http://127.0.0.1:${CANVASRELAY_WEB_PORT:-13080}
      CANVASRELAY_DATA_DIR: /data
      CANVASRELAY_DATABASE_URL: postgresql+psycopg://${CANVASRELAY_POSTGRES_USER:-canvasrelay}:${CANVASRELAY_POSTGRES_PASSWORD:-canvasrelay-dev-only}@postgres:5432/${CANVASRELAY_POSTGRES_DB:-canvasrelay}
      CANVASRELAY_CODEX_OAUTH_ALLOW_DOCKER_GATEWAY: "true"
    volumes:
      - canvasrelay-data:/data
    ports:
      - "127.0.0.1:${CANVASRELAY_API_PORT:-18080}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--frozen",
          "--no-dev",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CANVASRELAY_API_URL: http://localhost:${CANVASRELAY_API_PORT:-18080}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CANVASRELAY_WEB_PORT:-13080}:3000"

volumes:
  canvasrelay-data:
  canvasrelay-postgres:
