name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm test:web
      - run: pnpm build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.0
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --directory apps/api --frozen
      - run: uv run --directory apps/api ruff check .
      - run: uv run --directory apps/api mypy app tests
      - run: uv run --directory apps/api pytest

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @canvasrelay/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  contract-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.0
          enable-cache: true
      - run: uv python install 3.12
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory apps/api --frozen
      - run: pnpm contracts:check
      - run: pnpm policy:check
